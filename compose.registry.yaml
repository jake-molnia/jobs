services:
  app:
    image: ${APPLY_IMAGE:-ghcr.io/jake-molnia/jobs:latest}
    ports:
      - "3000:3000"
    environment:
      WRITE_TOKEN: ${WRITE_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-}
    volumes:
      - apply-data:/app/data
    restart: unless-stopped
volumes:
  apply-data:
